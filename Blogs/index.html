<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Raymond | Software Engineer & AI Specialist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3b82f6', // blue-500
                        secondary: '#1e293b', // slate-800
                        dark: '#0f172a', // slate-900
                        accent: '#8b5cf6' // violet-500
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .blog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="antialiased selection:bg-primary selection:text-white">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-panel border-b border-white/10 transition-all duration-300 bg-secondary/80 shadow-lg" id="navbar">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex-shrink-0 font-bold text-xl tracking-wider text-white">
                    <a href="../index.html">DUAN Zihang Raymond</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="../index.html#about" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">About</a>
                        <a href="../index.html#skills" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Skills</a>
                        <a href="../index.html#experience" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Experience</a>
                        <a href="../index.html#projects" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Projects</a>
                        <a href="../index.html#education" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Education</a>
                        <a href="index.html" class="text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Blog</a>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" id="mobile-menu-button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-white/10 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="md:hidden hidden glass-panel border-t border-white/10 absolute w-full left-0" id="mobile-menu">
            <div class="px-4 pt-2 pb-4 space-y-1 sm:px-3 shadow-lg">
                <a href="../index.html#about" class="mobile-link text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">About</a>
                <a href="../index.html#skills" class="mobile-link text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Skills</a>
                <a href="../index.html#experience" class="mobile-link text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Experience</a>
                <a href="../index.html#projects" class="mobile-link text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Projects</a>
                <a href="../index.html#education" class="mobile-link text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Education</a>
                <a href="index.html" class="mobile-link text-white block px-3 py-2 rounded-md text-base font-medium">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="pt-32 pb-12 px-4 border-b border-white/10">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-4">
                My <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">Blog</span>
            </h1>
            <p class="text-lg text-gray-400 max-w-2xl mx-auto">
                Thoughts, learnings, and experiences on software development, AI, and life.
            </p>
        </div>
    </section>

    <!-- Blogs List Section -->
    <section class="py-16 min-h-[50vh]">
        <div class="max-w-4xl mx-auto px-4" id="blogs-container">
            <!-- Blogs will be injected here via JavaScript -->
        </div>
    </section>

    <!-- Floating Appointment Button -->
    <a href="https://calendly.com/raymondduan0920/30min" target="_blank" rel="noopener noreferrer" class="fixed bottom-6 right-6 z-50 bg-primary hover:bg-blue-600 text-white p-4 md:px-5 md:py-3 rounded-full shadow-lg shadow-primary/30 flex items-center justify-center gap-2 font-medium transition-all hover:-translate-y-1 hover:shadow-xl hover:shadow-primary/40 group">
        <i class="fas fa-calendar-check text-xl group-hover:scale-110 transition-transform"></i>
        <span class="hidden md:block">Book Appointment</span>
    </a>

    <!-- Footer -->
    <footer class="py-8 border-t border-white/10 text-center text-gray-500 relative">
        <p>© 2026 Raymond Duan</p>
        
        <!-- Visitor Counter -->
        <div class="absolute bottom-4 left-4 md:bottom-6 md:left-6 opacity-60 hover:opacity-100 transition-opacity">
            <a href="https://vbr.nathanchung.dev/info/ANA7380.github.io" target="_blank" rel="noopener noreferrer" title="Page Visitors">
                <img src="https://vbr.nathanchung.dev/badge?page_id=ANA7380.github.io&color=3B82F6&lcolor=1E293B&text=Visitors" alt="Visitor Count" class="h-5 md:h-6 rounded" />
            </a>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Mobile menu toggle
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });

        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                menu.classList.add('hidden');
            });
        });

        // -------------------------------------------------------------
        // BLOG DATA
        // To add a new blog, simply add a new object to the TOP of this array.
        // The blogs will automatically be displayed from latest to oldest.
        // You can link 'url' to any file type you decide to use (.html, .md, external link, etc.)
        // -------------------------------------------------------------
        const blogs = [
            {
                title: "Hello Everyone! Welcome to My Blog",
                date: "June 03, 2026",
                summary: "Hello everyone! Welcome to my brand new blog.",
                url: "post.html?file=hello-everyone.md", 
                tags: ["Life", "Introduction"]
            }
        ];

        // Render Blogs
        const container = document.getElementById('blogs-container');

        if (blogs.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-pen-nib text-4xl text-gray-600 mb-4"></i>
                    <h3 class="text-xl text-gray-400">No blog posts yet.</h3>
                    <p class="text-gray-500 mt-2">Check back soon for new content!</p>
                </div>
            `;
        } else {
            blogs.forEach(blog => {
                // Create tags HTML
                const tagsHtml = (blog.tags || []).map(tag => 
                    `<span class="text-xs font-semibold text-primary bg-primary/10 px-2 py-1 rounded">${tag}</span>`
                ).join('');

                const card = document.createElement('div');
                card.className = "glass-panel rounded-2xl p-6 mb-6 blog-card transition-all duration-300 flex flex-col md:flex-row gap-6";
                
                card.innerHTML = `
                    <div class="flex-grow">
                        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-2">
                            <h3 class="text-2xl font-bold text-white hover:text-primary transition-colors">
                                <a href="${blog.url}">${blog.title}</a>
                            </h3>
                            <span class="text-sm text-gray-400 mt-1 md:mt-0 flex-shrink-0"><i class="far fa-calendar-alt mr-2"></i>${blog.date}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mb-4 mt-3">
                            ${tagsHtml}
                        </div>
                        <p class="text-gray-400 mb-4 line-clamp-3">
                            ${blog.summary}
                        </p>
                        <a href="${blog.url}" class="inline-flex items-center text-primary font-medium hover:text-blue-400 transition-colors group">
                            Read Article <i class="fas fa-arrow-right ml-2 transform group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
